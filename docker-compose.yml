services:
  db:
    image: postgres:16-alpine
    container_name: gestion-eventos-db
    environment:
      POSTGRES_DB: gestion_eventos
      POSTGRES_USER: gestion_eventos
      POSTGRES_PASSWORD: gestion_eventos
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./gestion_eventos.sql:/docker-entrypoint-initdb.d/gestion_eventos.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gestion_eventos -d gestion_eventos"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./server
    container_name: gestion-eventos-backend
    environment:
      PORT: 3000
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: gestion_eventos
      DB_USER: gestion_eventos
      DB_PASSWORD: gestion_eventos
      JWT_SECRET: ${JWT_SECRET:-cambia-esta-clave-para-produccion}
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./client
      args:
        VITE_API_URL: http://localhost:3000/api
    container_name: gestion-eventos-frontend
    ports:
      - "4173:4173"
    depends_on:
      - backend

volumes:
  postgres_data:
